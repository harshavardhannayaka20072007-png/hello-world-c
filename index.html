<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f4f6f8;
            color: #222;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        section {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .project {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Hello World Portfolio</h1>
        <p>A simple portfolio created using Git and GitHub.</p>
    </header>

    <section id="projects">
        <h2>Projects</h2>

        <div class="project">
            <h3>Hello World in C</h3>
            <p>
                A beginner C programming project created to practice
                writing, compiling, and running a simple program.
            </p>
        </div>
    </section>

</body>
</html>
